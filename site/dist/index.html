  <template id="routine-wake">
<section class="topic" id="wake-1" data-phase=""><ul role="list"><li data-source-line="5"><p>يستحب الاستيقاظ قبل صلاة الفجر</p></li>
<li data-source-line="6"><p>إبدأ بالسواك كما كان يبدأ رسول الله صلى الله عليه و سلم</p></li>
<li data-source-line="7"><p>وقل (الحمد الله الذي أحيانا بعد ما أماتنا وإليه النشور)</p></li>
<li data-source-line="8"><p>و (الحمد الله الذي عافاني في جسدي ، ورد علي روحي ، وأذن لي بذكره)</p></li>
<li data-source-line="9"><p>و أواخر سورة آل عمران:</p><p class="quran">إِنَّ فِى خَلْقِ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ وَٱخْتِلَـٰفِ ٱلَّيْلِ وَٱلنَّهَارِ لَـَٔايَـٰتٍ لِّأُو۟لِى ٱلْأَلْبَـٰبِ ١٩٠ ٱلَّذِينَ يَذْكُرُونَ ٱللَّهَ قِيَـٰمًا وَقُعُودًا وَعَلَىٰ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِى خَلْقِ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضِ رَبَّنَا مَا خَلَقْتَ هَـٰذَا بَـٰطِلًا سُبْحَـٰنَكَ فَقِنَا عَذَابَ ٱلنَّارِ ١٩١ رَبَّنَآ إِنَّكَ مَن تُدْخِلِ ٱلنَّارَ فَقَدْ أَخْزَيْتَهُۥ ۖ وَمَا لِلظَّـٰلِمِينَ مِنْ أَنصَارٍ ١٩٢ رَّبَّنَآ إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِى لِلْإِيمَـٰنِ أَنْ ءَامِنُوا۟ بِرَبِّكُمْ فَـَٔامَنَّا ۚ رَبَّنَا فَٱغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّـَٔاتِنَا وَتَوَفَّنَا مَعَ ٱلْأَبْرَارِ ١٩٣ رَبَّنَا وَءَاتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ ٱلْقِيَـٰمَةِ ۗ إِنَّكَ لَا تُخْلِفُ ٱلْمِيعَادَ ١٩٤فَٱسْتَجَابَ لَهُمْ رَبُّهُمْ أَنِّى لَآ أُضِيعُ عَمَلَ عَـٰمِلٍ مِّنكُم مِّن ذَكَرٍ أَوْ أُنثَىٰ ۖ بَعْضُكُم مِّنۢ بَعْضٍ ۖ فَٱلَّذِينَ هَاجَرُوا۟ وَأُخْرِجُوا۟ مِن دِيَـٰرِهِمْ وَأُوذُوا۟ فِى سَبِيلِى وَقَـٰتَلُوا۟ وَقُتِلُوا۟ لَأُكَفِّرَنَّ عَنْهُمْ سَيِّـَٔاتِهِمْ وَلَأُدْخِلَنَّهُمْ جَنَّـٰتٍ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ ثَوَابًا مِّنْ عِندِ ٱللَّهِ ۗ وَٱللَّهُ عِندَهُۥ حُسْنُ ٱلثَّوَابِ ١٩٥ لَا يَغُرَّنَّكَ تَقَلُّبُ ٱلَّذِينَ كَفَرُوا۟ فِى ٱلْبِلَـٰدِ ١٩٦ مَتَـٰعٌ قَلِيلٌ ثُمَّ مَأْوَىٰهُمْ جَهَنَّمُ ۚ وَبِئْسَ ٱلْمِهَادُ ١٩٧ لَـٰكِنِ ٱلَّذِينَ ٱتَّقَوْا۟ رَبَّهُمْ لَهُمْ جَنَّـٰتٌ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَـٰرُ خَـٰلِدِينَ فِيهَا نُزُلًا مِّنْ عِندِ ٱللَّهِ ۗ وَمَا عِندَ ٱللَّهِ خَيْرٌ لِّلْأَبْرَارِ ١٩٨ وَإِنَّ مِنْ أَهْلِ ٱلْكِتَـٰبِ لَمَن يُؤْمِنُ بِٱللَّهِ وَمَآ أُنزِلَ إِلَيْكُمْ وَمَآ أُنزِلَ إِلَيْهِمْ خَـٰشِعِينَ لِلَّهِ لَا يَشْتَرُونَ بِـَٔايَـٰتِ ٱللَّهِ ثَمَنًا قَلِيلًا ۗ أُو۟لَـٰٓئِكَ لَهُمْ أَجْرُهُمْ عِندَ رَبِّهِمْ ۗ إِنَّ ٱللَّهَ سَرِيعُ ٱلْحِسَابِ ١٩٩ يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱصْبِرُوا۟ وَصَابِرُوا۟ وَرَابِطُوا۟ وَٱتَّقُوا۟ ٱللَّهَ لَعَلَّكُمْ تُفْلِحُونَ ٢٠٠</p></li>
<li data-source-line="13"><p>و عند الذهاب لصلاة الفجر قل عند لبس الثوب: (الحمد الله الذي كساني هذا ورزقنيه من غير حول مني ولا قوة)</p></li></ul></section>
</template>
<template id="routine-fajr">
<section class="topic" id="fajr-1" data-phase="before"><h2>آداب دخول الخلاء</h2><ul role="list"><li data-source-line="21"><p>أدخل برجلك اليسرى و أخرج برجلك اليمنى، و لا تدخل حافي القدمين</p></li>
<li data-source-line="22"><p>عند الدخول قل (باسم الله، اللهم أني أعوذ بك من الخبث و الخبائث)</p></li>
<li data-source-line="23"><p>و عند الخروج فقل (غفرانك)</p></li></ul></section>
<section class="topic" id="fajr-2" data-phase="before"><h2>آداب الوضوء</h2><ul role="list"><li data-source-line="27"><p>ابدأ بالسواك امتثالا لرسول الله صلى الله عليه و سلم: (لولا أن أشق على أمتي لأمرتهم بالسواك مع كل وضوء)</p></li>
<li data-source-line="28"><p>قبل الوضوء قل (باسم الله)</p></li>
<li data-source-line="29"><p>عند الفراغ من الوضوء قل (أشهد أن لا إله إلا الله وحده لا شريك له، و أشهد أن محمدا عبده و رسوله، سبحانك اللهم وبحمدك، أشهد أن لا إله إلا أنت ، أستغفرك وأتوب إليك)</p></li></ul></section>
<section class="topic" id="fajr-3" data-phase="before"><h2>آداب الخروج إلى المسجد</h2><ul role="list"><li data-source-line="33"><p>صلاة سنة الفجر في البيت (السنة أن تقرأ في الركعة الأولى سورة الكافرون، و في الثانية سورة الإخلاص)</p><div class="quran"><h3>سورة الكافرون</h3><p> قُلْ يَـٰٓأَيُّهَا ٱلْكَـٰفِرُونَ <span class="verse-number">١</span> لَآ أَعْبُدُ مَا تَعْبُدُونَ <span class="verse-number">٢</span> وَلَآ أَنتُمْ عَـٰبِدُونَ مَآ أَعْبُدُ <span class="verse-number">٣</span> وَلَآ أَنَا۠ عَابِدٌ مَّا عَبَدتُّمْ <span class="verse-number">٤</span> وَلَآ أَنتُمْ عَـٰبِدُونَ مَآ أَعْبُدُ <span class="verse-number">٥</span> لَكُمْ دِينُكُمْ وَلِىَ دِينِ <span class="verse-number">٦</span></p></div>
<div class="quran"><h3>سورة الإخلاص</h3><p> قُلْ هُوَ ٱللَّهُ أَحَدٌ <span class="verse-number">١</span> ٱللَّهُ ٱلصَّمَدُ <span class="verse-number">٢</span> لَمْ يَلِدْ وَلَمْ يُولَدْ <span class="verse-number">٣</span> وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ <span class="verse-number">٤</span></p></div></li>
<li data-source-line="34"><p>و عند الخروج من البيت قل (باسم الله، توكلت على الله، و لا حول و لا قوة إلا بالله)، (اللَّهمَّ إنِّي أعوذُ بِك مِن أَن أضِلَّ أو أزِلَّ أو أظلِمَ أو أُظلَمَ أو أجهَلَ أو يُجهَلَ عليَّ)، (اللهُمَّ اجْعَلْ فِي قَلْبِي نُورًا، وَفِي لِسَانِي نُورًا، وَاجْعَلْ فِي سَمْعِي نُورًا، وَاجْعَلْ فِي بَصَرِي نُورًا، وَاجْعَلْ مِنْ خَلْفِي نُورًا، وَمِنْ أَمَامِي نُورًا، وَاجْعَلْ مِنْ فَوْقِي نُورًا، وَمِنْ تَحْتِي نُورًا، اللهُمَّ أَعْطِنِي نُورًا)</p></li></ul></section>
<section class="topic" id="fajr-4" data-phase="before"><h2>آداب سماع الأذان</h2><ul role="list"><li data-source-line="38"><p>قل كما يقول المؤذن في كل كلمة إلا الحيعلتين فقل فيهما (لا حول و لا قوة إلا بالله)</p></li>
<li data-source-line="39"><p>و بعد إنتهاء المؤذن قفل (و أنا أشهد أن لا إله إلا الله وحده لا شريك له و أن محمدا عبده و رسوله، رضيت بالله رباً، و بالأسلام ديناً، و بمحمد صلى الله عليه و سلم رسولاً)</p></li>
<li data-source-line="40"><p>ثم صلِ و سلم على النبي</p></li>
<li data-source-line="41"><p>ثم قل (اللهم رب هذه الدعوة التامة والصلاة القائمة، آت سيدنا محمداً الوسيلة و الفضيلة، و ابعثه مقاماً محموداً الذي وعدته)</p></li></ul></section>
<section class="topic" id="fajr-5" data-phase="before"><h2>آداب دخول المسجد</h2><ul role="list"><li data-source-line="45"><p>أدخل برجلك اليمنى و قل (باسم الله، أعوذ باللهّ العظيم وبوجهه الكريم وسلطانه القديم من الشيطان الرجيم)، (اللهم صل و سلم على محمد و على آل محمد، اللهم اغفر لي ذنوبي وافتح لي أبواب رحمتك)</p></li>
<li data-source-line="46"><p>لا تغفل عن الدعاء بين الأذان و الإقامة، فقد قال رسول الله صلى الله عليه و سلم: (الدعاء لا يرد بين الأذان و الإقامة، فادعوا)</p></li></ul></section>
<section class="topic" id="fajr-6" data-phase="after"><h2>أذكار بعد الصلاة</h2><ul role="list"><li data-source-line="52"><p>قل (أستغفر الله، أستغفر الله، أستغفر الله، اللهم أنت السلام و منك السلام تباركت يا ذا الجلال والإكرام)</p></li>
<li data-source-line="53"><p>و (اللهم أعني على ذكرك وشكرك وحسن عبادتك)</p></li>
<li data-source-line="54"><p>و (لا إله إلا الله وحده لا شريك له ، له الملك و له الحمد، وهو على كل شيء قدير، لا حول ولا قوة إلا بالله ، لا إله إلا الله ، ولا نعبد إلا إياه، له النعمة و له الفضل و له الثناء الحسن، لا إله إلا الله مخلصين له الدين ولو كره الكافرون</p></li>
<li data-source-line="55"><p>و (لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، اللهم لا مانع لما أعطيت، و لا معطي لما منعت، و لا ينفع ذا الجَدِّ منك الجَدُّ)</p></li>
<li data-source-line="56"><p>و (اللهم اغفر لي خطاياي وذنوبي كلها ، اللهم أنعشني، واجبرني ، واهدني لصالح الأخلاق، فإنه لا يهدي لصالحها ولا يصرف سيئها إلا أنت)</p></li>
<li data-source-line="57"><p>ثم قل سبحان الله <span class="repeat">٣٣</span> مرة، و الحمد لله <span class="repeat">٣٣</span>، و الله أكبر <span class="repeat">٣٣</span>، ثم أتم المائة ب (لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير)</p></li>
<li data-source-line="58"><p>و قل آية الكرسي</p><div class="quran"><h3>آية الكرسي</h3><p>ٱللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُۥ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ <span class="verse-number">٢٥٥</span></p></div></li>

<section class="topic" id="isha-3" data-phase="before"><h2>آداب الخروج إلى المسجد</h2><ul role="list"><li data-source-line="243"><p>صلاة سنة الفجر في البيت (السنة أن تقرأ في الركعة الأولى سورة الكافرون، و في الثانية سورة الإخلاص)</p><div class="quran"><h3>سورة الكافرون</h3><p> قُلْ يَـٰٓأَيُّهَا ٱلْكَـٰفِرُونَ <span class="verse-number">١</span> لَآ أَعْبُدُ مَا تَعْبُدُونَ <span class="verse-number">٢</span> وَلَآ أَنتُمْ عَـٰبِدُونَ مَآ أَعْبُدُ <span class="verse-number">٣</span> وَلَآ أَنَا۠ عَابِدٌ مَّا عَبَدتُّمْ <span class="verse-number">٤</span> وَلَآ أَنتُمْ عَـٰبِدُونَ مَآ أَعْبُدُ <span class="verse-number">٥</span> لَكُمْ دِينُكُمْ وَلِىَ دِينِ <span class="verse-number">٦</span></p></div>
<div class="quran"><h3>سورة الإخلاص</h3><p> قُلْ هُوَ ٱللَّهُ أَحَدٌ <span class="verse-number">١</span> ٱللَّهُ ٱلصَّمَدُ <span class="verse-number">٢</span> لَمْ يَلِدْ وَلَمْ يُولَدْ <span class="verse-number">٣</span> وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ <span class="verse-number">٤</span></p></div></li>
<li data-source-line="244"><p>و عند الخروج من البيت قل (باسم الله، توكلت على الله، و لا حول و لا قوة إلا بالله)، (اللَّهمَّ إنِّي أعوذُ بِك مِن أَن أضِلَّ أو أزِلَّ أو أظلِمَ أو أُظلَمَ أو أجهَلَ أو يُجهَلَ عليَّ)، (اللهُمَّ اجْعَلْ فِي قَلْبِي نُورًا، وَفِي لِسَانِي نُورًا، وَاجْعَلْ فِي سَمْعِي نُورًا، وَاجْعَلْ فِي بَصَرِي نُورًا، وَاجْعَلْ مِنْ خَلْفِي نُورًا، وَمِنْ أَمَامِي نُورًا، وَاجْعَلْ مِنْ فَوْقِي نُورًا، وَمِنْ تَحْتِي نُورًا، اللهُمَّ أَعْطِنِي نُورًا)</p></li></ul></section>
<section class="topic" id="isha-4" data-phase="before"><h2>آداب سماع الأذان</h2><ul role="list"><li data-source-line="248"><p>قل كما يقول المؤذن في كل كلمة إلا الحيعلتين فقل فيهما (لا حول و لا قوة إلا بالله)</p></li>
<li data-source-line="249"><p>و بعد إنتهاء المؤذن قفل (و أنا أشهد أن لا إله إلا الله وحده لا شريك له و أن محمدا عبده و رسوله، رضيت بالله رباً، و بالأسلام ديناً، و بمحمد صلى الله عليه و سلم رسولاً)</p></li>
<li data-source-line="250"><p>ثم صلِ و سلم على النبي</p></li>
<li data-source-line="251"><p>ثم قل (اللهم رب هذه الدعوة التامة والصلاة القائمة، آت سيدنا محمداً الوسيلة و الفضيلة، و ابعثه مقاماً محموداً الذي وعدته)</p></li></ul></section>
<section class="topic" id="isha-5" data-phase="before"><h2>آداب دخول المسجد</h2><ul role="list"><li data-source-line="255"><p>أدخل برجلك اليمنى و قل (باسم الله، أعوذ باللهّ العظيم وبوجهه الكريم وسلطانه القديم من الشيطان الرجيم)، (اللهم صل و سلم على محمد و على آل محمد، اللهم اغفر لي ذنوبي وافتح لي أبواب رحمتك)</p></li>
<li data-source-line="256"><p>لا تغفل عن الدعاء بين الأذان و الإقامة، فقد قال رسول الله صلى الله عليه و سلم: (الدعاء لا يرد بين الأذان و الإقامة، فادعوا)</p></li>
<li data-source-line="257"><p>صل ركعتين قبل صلاة العشاء، فقد قال رسول الله صلى الله عليه و سلم (بين كل أذانين صلاة، بين كل أذانين صلاة، ثم قال في الثالثة لمن شاء)</p></li>
<li data-source-line="258"><p>ثم صل ركعتين بعد الصلاة</p></li>
<li data-source-line="259"><p>ثم صل الوتر واحدة أو ثلاث، فكان رسول الله صلى الله عليه و سلم إذا أوتر بثلاث ركعات قرأ فيها سورة الأعلى، و سورة الكافرون، و سورة الإخلاص</p><div class="quran"><h3>سورة الأعلى</h3><p> سَبِّحِ ٱسْمَ رَبِّكَ ٱلْأَعْلَى <span class="verse-number">١</span> ٱلَّذِى خَلَقَ فَسَوَّىٰ <span class="verse-number">٢</span> وَٱلَّذِى قَدَّرَ فَهَدَىٰ <span class="verse-number">٣</span> وَٱلَّذِىٓ أَخْرَجَ ٱلْمَرْعَىٰ <span class="verse-number">٤</span> فَجَعَلَهُۥ غُثَآءً أَحْوَىٰ <span class="verse-number">٥</span> سَنُقْرِئُكَ فَلَا تَنسَىٰٓ <span class="verse-number">٦</span> إِلَّا مَا شَآءَ ٱللَّهُ ۚ إِنَّهُۥ يَعْلَمُ ٱلْجَهْرَ وَمَا يَخْفَىٰ <span class="verse-number">٧</span> وَنُيَسِّرُكَ لِلْيُسْرَىٰ <span class="verse-number">٨</span> فَذَكِّرْ إِن نَّفَعَتِ ٱلذِّكْرَىٰ <span class="verse-number">٩</span> سَيَذَّكَّرُ مَن يَخْشَىٰ <span class="verse-number">١٠</span> وَيَتَجَنَّبُهَا ٱلْأَشْقَى <span class="verse-number">١١</span> ٱلَّذِى يَصْلَى ٱلنَّارَ ٱلْكُبْرَىٰ <span class="verse-number">١٢</span> ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ <span class="verse-number">١٣</span> قَدْ أَفْلَحَ مَن تَزَكَّىٰ <span class="verse-number">١٤</span> وَذَكَرَ ٱسْمَ رَبِّهِۦ فَصَلَّىٰ <span class="verse-number">١٥</span> بَلْ تُؤْثِرُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا <span class="verse-number">١٦</span> وَٱلْـَٔاخِرَةُ خَيْرٌ وَأَبْقَىٰٓ <span class="verse-number">١٧</span> إِنَّ هَـٰذَا لَفِى ٱلصُّحُفِ ٱلْأُولَىٰ <span class="verse-number">١٨</span> صُحُفِ إِبْرَٰهِيمَ وَمُوسَىٰ <span class="verse-number">١٩</span></p></div>
<div class="quran"><h3>سورة الكافرون</h3><p> قُلْ يَـٰٓأَيُّهَا ٱلْكَـٰفِرُونَ <span class="verse-number">١</span> لَآ أَعْبُدُ مَا تَعْبُدُونَ <span class="verse-number">٢</span> وَلَآ أَنتُمْ عَـٰبِدُونَ مَآ أَعْبُدُ <span class="verse-number">٣</span> وَلَآ أَنَا۠ عَابِدٌ مَّا عَبَدتُّمْ <span class="verse-number">٤</span> وَلَآ أَنتُمْ عَـٰبِدُونَ مَآ أَعْبُدُ <span class="verse-number">٥</span> لَكُمْ دِينُكُمْ وَلِىَ دِينِ <span class="verse-number">٦</span></p></div>
<div class="quran"><h3>سورة الإخلاص</h3><p> قُلْ هُوَ ٱللَّهُ أَحَدٌ <span class="verse-number">١</span> ٱللَّهُ ٱلصَّمَدُ <span class="verse-number">٢</span> لَمْ يَلِدْ وَلَمْ يُولَدْ <span class="verse-number">٣</span> وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ <span class="verse-number">٤</span></p></div></li>
<li data-source-line="260"><p>و كان النبي يقول بعد التسليم من الوتر: (سبحان الملك القدوس) ثلاث مرات و يرفع صوته في الثالثة</p></li></ul></section>
<section class="topic" id="isha-6" data-phase="after"><h2>أذكار بعد الصلاة</h2><ul role="list"><li data-source-line="266"><p>قل (أستغفر الله، أستغفر الله، أستغفر الله، اللهم أنت السلام و منك السلام تباركت يا ذا الجلال والإكرام)</p></li>
<li data-source-line="267"><p>و (اللهم أعني على ذكرك وشكرك وحسن عبادتك)</p></li>
<li data-source-line="268"><p>و (لا إله إلا الله وحده لا شريك له ، له الملك و له الحمد، وهو على كل شيء قدير، لا حول ولا قوة إلا بالله ، لا إله إلا الله ، ولا نعبد إلا إياه، له النعمة و له الفضل و له الثناء الحسن، لا إله إلا الله مخلصين له الدين ولو كره الكافرون</p></li>
<li data-source-line="269"><p>و (لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير، اللهم لا مانع لما أعطيت، و لا معطي لما منعت، و لا ينفع ذا الجَدِّ منك الجَدُّ)</p></li>
<li data-source-line="270"><p>و (اللهم اغفر لي خطاياي وذنوبي كلها ، اللهم أنعشني، واجبرني ، واهدني لصالح الأخلاق، فإنه لا يهدي لصالحها ولا يصرف سيئها إلا أنت)</p></li>
<li data-source-line="271"><p>ثم قل سبحان الله <span class="repeat">٣٣</span> مرة، و الحمد لله <span class="repeat">٣٣</span>، و الله أكبر <span class="repeat">٣٣</span>، ثم أتم المائة ب (لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير)</p></li>
<li data-source-line="272"><p>ثم قل مرة واحدة سورة الإخلاص، و المعوذتين</p><div class="quran"><h3>سورة الإخلاص</h3><p> قُلْ هُوَ ٱللَّهُ أَحَدٌ <span class="verse-number">١</span> ٱللَّهُ ٱلصَّمَدُ <span class="verse-number">٢</span> لَمْ يَلِدْ وَلَمْ يُولَدْ <span class="verse-number">٣</span> وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ <span class="verse-number">٤</span></p></div>
<div class="quran"><h3>سورة الفلق</h3><p> قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ <span class="verse-number">١</span> مِن شَرِّ مَا خَلَقَ <span class="verse-number">٢</span> وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ <span class="verse-number">٣</span> وَمِن شَرِّ ٱلنَّفَّـٰثَـٰتِ فِى ٱلْعُقَدِ <span class="verse-number">٤</span> وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ <span class="verse-number">٥</span></p></div>
<div class="quran"><h3>سورة الناس</h3><p> قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ <span class="verse-number">١</span> مَلِكِ ٱلنَّاسِ <span class="verse-number">٢</span> إِلَـٰهِ ٱلنَّاسِ <span class="verse-number">٣</span> مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ <span class="verse-number">٤</span> ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ <span class="verse-number">٥</span> مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ <span class="verse-number">٦</span></p></div></li>
<li data-source-line="273"><p>و قل آية الكرسي</p><div class="quran"><h3>آية الكرسي</h3><p>ٱللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُۥ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ <span class="verse-number">٢٥٥</span></p></div></li></ul></section>
<section class="topic" id="isha-7" data-phase="after"><h2>دعاء الخروج من المسجد</h2><ul role="list"><li data-source-line="277"><p>(يَبْدَأُ بِرِجْلِهِ الْيُسْرَى) وَيَقُولُ: (بِسْمِ اللَّهِ وَالصّلَاةُ وَالسَّلَامُ عَلَى رَسُولِ اللَّهِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِك، اللَّهُمَّ اعْصِمْنِي مِنَ الشَّيْطَانِ الرَّجِيمِ)</p></li></ul></section>

<div class="quran"><h3>سورة الناس</h3><p> قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ <span class="verse-number">١</span> مَلِكِ ٱلنَّاسِ <span class="verse-number">٢</span> إِلَـٰهِ ٱلنَّاسِ <span class="verse-number">٣</span> مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ <span class="verse-number">٤</span> ٱلَّذِى يُوَسْوِسُ فِى صُدُورِ ٱلنَّاسِ <span class="verse-number">٥</span> مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ <span class="verse-number">٦</span></p></div></li>
<li data-source-line="284"><p>ثم إقرأ آية الكرسي</p><div class="quran"><h3>آية الكرسي</h3><p>ٱللَّهُ لَآ إِلَـٰهَ إِلَّا هُوَ ٱلْحَىُّ ٱلْقَيُّومُ ۚ لَا تَأْخُذُهُۥ سِنَةٌ وَلَا نَوْمٌ ۚ لَّهُۥ مَا فِى ٱلسَّمَـٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ مَن ذَا ٱلَّذِى يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَىْءٍ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَ ۚ وَسِعَ كُرْسِيُّهُ ٱلسَّمَـٰوَٰتِ وَٱلْأَرْضَ ۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَا ۚ وَهُوَ ٱلْعَلِىُّ ٱلْعَظِيمُ <span class="verse-number">٢٥٥</span></p></div></li>
<li data-source-line="285"><p>ثم أواخر سورة البقرة:</p><p class="quran">ءَامَنَ ٱلرَّسُولُ بِمَآ أُنزِلَ إِلَيْهِ مِن رَّبِّهِۦ وَٱلْمُؤْمِنُونَ ۚ كُلٌّ ءَامَنَ بِٱللَّهِ وَمَلَـٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِۦ ۚ وَقَالُوا۟ سَمِعْنَا وَأَطَعْنَا ۖ غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ ٱلْمَصِيرُ ٢٨٥ لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَـٰفِرِينَ ٢٨٦</p></li>
<li data-source-line="289"><p>ثم سبحان الله <span class="repeat">٣٣</span>، و الحمد لله <span class="repeat">٣٣</span>، و الله أكبر <span class="repeat">٣٤</span></p></li>
<li data-source-line="290"><p>ثم اضطجع على شقك الأيمن و ضع يدك اليمنى تحت  خدك ثم قل (اللهم قِني عذابك يوم تبعث عبادك) ثلاث مرات</p></li>
<li data-source-line="291"><p>و قل (اللهم ربّ السماوات السبع، وربّ العرش العظيم، ربنا وربّ كل شيءٍ، فالق الحب والنوى، ومنزل التوراة والإنجيل والفرقان، أعوذ بك من شرِّ كل ذي شرٍّ أنت آخذٌ بناصيته، أنت الأول فليس قبلك شيء، وأنت الآخر فليس بعدك شيء، وأنت الظاهر فليس فوقك شيء -يعني: هو العالي فوق خلقه- وأنت الباطن فليس دونك شيء اقضِ عنا الدينَ، وأغننا من الفقر)</p></li>
<li data-source-line="292"><p>ثم قل (باسمك اللهم أموت و أحيا)</p></li>
<li data-source-line="293"><p>و اجعل آخر ما تقول (اللهُمَّ أسلَمتُ وجهي إليكَ، وفَوَّضتُ أمري إليكَ، وألجَأتُ ظَهري إليكَ، رَغبةً ورَهبةً إليكَ، لا مَلجَأَ ولا مَنجا مِنكَ إلَّا إليكَ، اللهُمَّ آمَنتُ بكِتابِكَ الذي أنزَلتَ، وبِنَبيِّكَ الذي أرسَلتَ)</p></li></ul></section>
